name: release

# Every merge to main can cut a release; nobody pushes tags by hand.
#
#   meta     go run ./cmd/release-meta decides the version (previous tag + a
#            patch bump, or minor/major from a release:minor / release:major
#            PR label) and whether to release at all (not when only docs/**,
#            **/*.md or .github/** changed since the previous tag, or the PR
#            has release:skip; release:force releases regardless).
#   build    darwin arm64 and amd64 tarballs with sha256 files.
#   publish  notes (Summary first, details collapsed) and `gh release create`,
#            which creates the tag on the merge commit. A tag pushed with
#            GITHUB_TOKEN triggers no workflow, which is why the build lives
#            here rather than behind a tag trigger.
#
# Manual runs (Actions -> release -> Run workflow, on main) always release:
#   bump     force patch, minor or major instead of the PR labels
#   version  release exactly this version, e.g. to publish again after a
#            failed or deleted release: gh release delete vX.Y.Z --cleanup-tag,
#            then run with version=vX.Y.Z
# docs/releasing.md has the details.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Bump level (auto = from the merged PRs' labels)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: Exact version to release, e.g. v0.3.0 (empty = next after the latest tag)
        type: string
        default: ""

permissions:
  contents: write # gh release create, which also creates the tag
  pull-requests: read # gh pr view for labels, title and summary

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  meta:
    name: decide version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.meta.outputs.release }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      # Full history and every tag: the previous version is the latest v* tag
      # reachable from the merge commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Decide version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          go run ./cmd/release-meta --repo "$GITHUB_REPOSITORY" --head "$GITHUB_SHA" \
            --bump "$BUMP" --version "$VERSION" --force="$FORCE" > meta.json
          cat meta.json
          jq -r '"release=\(.release)", "version=\(.version)"' meta.json >> "$GITHUB_OUTPUT"
          jq -r '"**\(.version)** release=\(.release): \(.reason)"' meta.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: meta.json

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: meta
    if: needs.meta.outputs.release == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/michaellady/longform-pipeline/internal/cli.Version=$VERSION" \
            -o dist/longform ./cmd/longform
          dist/longform version

      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd dist
          name="longform_${VERSION}_${GOOS}_${GOARCH}"
          tar -czf "$name.tar.gz" longform
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          rm longform

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    name: publish GitHub release
    needs: [meta, build]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: release-meta

      - name: Combined checksums
        run: |
          cd dist
          cat ./*.sha256 > checksums.txt
          ls -la

      # AGENTS.md rule 12: a plain-English title and a "## Summary" first, for a
      # non-technical reader. The summary is the merged PR's own "## Summary"
      # (each PR's, when several merged since the previous release).
      - name: Release notes
        run: |
          go run ./cmd/release-meta notes --meta meta.json --checksums dist/checksums.txt > notes.md
          cat notes.md

      # gh release create would quietly attach to an existing tag instead of
      # creating one on this commit.
      - name: Refuse an existing tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION already exists. To publish it again: gh release delete $VERSION --cleanup-tag, then run this workflow with version=$VERSION."
            exit 1
          fi

      - name: Create release
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "longform-pipeline $VERSION: $(jq -r .title meta.json)" \
            --notes-file notes.md \
            dist/*.tar.gz dist/*.sha256 dist/checksums.txt
