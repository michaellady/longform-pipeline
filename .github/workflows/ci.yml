name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l ./cmd ./internal)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: shell syntax
        run: |
          for f in $(git ls-files 'plugins/*/scripts/*.sh' 'plugins/**/*.sh' 2>/dev/null); do bash -n "$f"; done
