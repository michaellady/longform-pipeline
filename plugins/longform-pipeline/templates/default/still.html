<!doctype html>
<!--
  longform-pipeline default template: FRAME STILL with caption band (1080x1350)
  Placeholders: {{FRAME}} (file:// or data: URL of the extracted frame)
                {{CAPTION}} {{BRAND}} {{SITE}}
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frame still</title>
<style>
  :root {
    --bg: #0B0D10;
    --ink: #F4F1EA;
    --muted: #AEB6BF;
    --accent: #E8B74A;
    --font: -apple-system, "SF Pro Display", "Helvetica Neue", Inter, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .card { position: relative; width: 1080px; height: 1350px; display: flex; flex-direction: column; }
  .frame { flex: 1 1 auto; min-height: 0; overflow: hidden; background: #000; }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .band { flex: 0 0 auto; padding: 56px 72px 64px; border-top: 6px solid var(--accent); background: var(--bg); }
  .caption { font-size: 48px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .foot { display: flex; justify-content: space-between; margin-top: 36px; }
  .brand { font-size: 28px; font-weight: 800; }
  .site { font-size: 24px; color: var(--muted); }
</style>
</head>
<body>
<section class="card">
  <div class="frame"><img src="{{FRAME}}" alt=""></div>
  <div class="band">
    <div class="caption">{{CAPTION}}</div>
    <div class="foot">
      <div class="brand">{{BRAND}}</div>
      <div class="site">{{SITE}}</div>
    </div>
  </div>
</section>
</body>
</html>
